<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - PR Info</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Configuração e Auth - CAMINHOS CORRETOS -->
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <style>
    :root { --primary:#00b894; --primary-dark:#00a381; --bg-main:#f5f3ee; --bg-card:#fff; --text-dark:#2d3436; --text-medium:#636e72; --border:#e8e4dc; --radius:14px; --danger:#ef4444 }
    :root.dark-mode { --bg-main:#1a1a1a; --bg-card:#2a2a2a; --text-dark:#fff; --text-medium:#b0b0b0; --border:#3a3a3a }
    * { margin:0; padding:0; box-sizing:border-box }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg-main); color:var(--text-dark); min-height:100vh }
    .settings-container { display:flex; min-height:100vh }
    .settings-sidebar { width:280px; background:var(--bg-card); border-right:1px solid var(--border); padding:30px 20px; position:fixed; height:100vh }
    .sidebar-logo { display:flex; align-items:center; gap:12px; margin-bottom:40px; padding-bottom:20px; border-bottom:1px solid var(--border) }
    .sidebar-logo .logo-icon { width:44px; height:44px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#fff }
    .sidebar-logo .logo-text { font-size:20px; font-weight:700 }
    .sidebar-logo .logo-text span { color:var(--primary) }
    .settings-nav-item { padding:16px 20px; border-radius:var(--radius); cursor:pointer; display:flex; align-items:center; gap:12px; margin-bottom:8px; color:var(--text-medium); transition:all .3s }
    .settings-nav-item:hover { background:rgba(0,184,148,.05); color:var(--primary) }
    .settings-nav-item.active { background:linear-gradient(135deg,rgba(0,184,148,.15),rgba(0,184,148,.05)); color:var(--primary); font-weight:600; border-left:3px solid var(--primary) }
    .settings-nav-item i { width:20px; text-align:center }
    .nav-divider { margin:20px 0; border:0; border-top:1px solid var(--border) }
    .settings-content { flex:1; padding:40px; margin-left:280px }
    .card-settings { background:var(--bg-card); padding:40px; border-radius:20px; box-shadow:0 2px 12px rgba(0,0,0,.07); max-width:900px; margin:0 auto; animation:fadeIn .4s }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .section-title { margin-bottom:30px; font-size:24px; font-weight:700; padding-bottom:15px; border-bottom:2px solid var(--border) }
    .info-grid-vertical { display:flex; flex-direction:column; gap:16px }
    .input-group { display:flex; flex-direction:column; gap:8px; margin-bottom:20px }
    .input-group label { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-medium) }
    .input-group input, .input-group select { padding:14px 16px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:14px; background:var(--bg-main); color:var(--text-dark) }
    .input-group input:focus { border-color:var(--primary); outline:none }
    .btn-group { display:flex; gap:12px; margin-top:30px }
    .btn { padding:14px 28px; border-radius:var(--radius); font-size:14px; font-weight:600; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:8px }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff }
    .btn-primary:hover:not(:disabled) { transform:translateY(-2px) }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed }
    .btn-secondary { background:var(--bg-card); color:var(--text-dark); border:1.5px solid var(--border) }
    .loading-state { text-align:center; padding:60px 20px; color:var(--text-medium) }
    .loading-state i { font-size:40px; margin-bottom:16px; color:var(--primary); animation:spin 1s linear infinite }
    @keyframes spin { to{transform:rotate(360deg)} }
    .error-state { text-align:center; padding:60px 20px; color:var(--danger) }
    .error-state i { font-size:40px; margin-bottom:16px }
    .error-state p { margin:10px 0; font-size:14px }
    .toast { position:fixed; bottom:28px; right:28px; background:var(--primary); color:#fff; padding:14px 22px; border-radius:var(--radius); font-weight:600; display:none; align-items:center; gap:10px; z-index:3000; animation:slideIn .4s }
    .toast.show { display:flex }
    .toast.error { background:var(--danger) }
    @keyframes slideIn { from{transform:translateX(80px);opacity:0} to{transform:translateX(0);opacity:1} }
    @media(max-width:992px){ .settings-sidebar{width:80px;padding:20px 10px} .sidebar-logo .logo-text,.settings-nav-item span{display:none} .settings-nav-item{justify-content:center} .settings-content{margin-left:80px} }
    @media(max-width:768px){ .settings-sidebar{width:100%;height:auto;position:relative} .settings-content{margin-left:0} }
  </style>
</head>
<body>
  <div class="settings-container">
    <!-- SIDEBAR -->
    <aside class="settings-sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">PR</div>
        <span class="logo-text">PR <span>info</span></span>
      </div>
      <div class="settings-nav-item active" onclick="switchTab('perfil')" id="nav-perfil"><i class="fas fa-user-circle"></i><span>Perfil</span></div>
      <div class="settings-nav-item" onclick="switchTab('seguranca')" id="nav-seguranca"><i class="fas fa-shield-alt"></i><span>Segurança</span></div>
      <hr class="nav-divider">
      <div class="settings-nav-item" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i><span>Voltar</span></div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="settings-content">
      <div id="tab-perfil" class="card-settings">
        <h2 class="section-title">👤 Perfil do Utilizador</h2>
        <div id="perfil-loading" class="loading-state">
          <i class="fas fa-circle-notch fa-spin"></i><br>
          <strong>A carregar dados...</strong>
        </div>
        <div id="perfil-error" class="error-state" style="display:none">
          <i class="fas fa-exclamation-triangle"></i><br>
          <strong>Erro ao carregar</strong><br>
          <p id="error-msg"></p>
          <button class="btn btn-primary" onclick="location.reload()">🔄 Tentar</button>
        </div>
        <form id="form-perfil" style="display:none">
          <div class="info-grid-vertical">
            <div class="input-group"><label>Nome Completo</label><input type="text" id="perfil-nome" required></div>
            <div class="input-group"><label>Email</label><input type="email" id="perfil-email" required></div>
            <div class="input-group"><label>Telefone</label><input type="tel" id="perfil-telefone"></div>
            <div class="input-group"><label>NIF/BI</label><input type="text" id="perfil-nif"></div>
          </div>
          <div class="btn-group">
            <button type="button" class="btn btn-secondary" onclick="resetPerfil()">↺ Repor</button>
            <button type="submit" class="btn btn-primary" id="btn-save">✓ Guardar</button>
          </div>
        </form>
      </div>

      <div id="tab-seguranca" class="card-settings" style="display:none">
        <h2 class="section-title">🔐 Segurança</h2>
        <div class="info-grid-vertical">
          <div class="input-group"><label>Senha Actual</label><input type="password" id="seg-pass-atual"></div>
          <div class="input-group"><label>Nova Senha</label><input type="password" id="seg-nova-pass"></div>
          <div class="input-group"><label>Confirmar Nova Senha</label><input type="password" id="seg-confirm"></div>
        </div>
        <div class="btn-group">
          <button type="button" class="btn btn-primary" onclick="updatePassword()">🔒 Actualizar Senha</button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toast-msg"></span></div>

  <script>
    // ==================== ESTADO ====================
    let currentUser = null;
    let userSettings = null;

    // ==================== INICIALIZAÇÃO ====================
    window.addEventListener('load', async () => {
      console.log('🚀 Configurações a iniciar...');
      
      // Verificar sessão
      if (typeof isLoggedIn !== 'function' || !isLoggedIn()) {
        console.log('❌ Não logado, redirecionando...');
        window.location.href = 'login.html';
        return;
      }

      const localUser = JSON.parse(localStorage.getItem('prinfo_user') || '{}');
      console.log('👤 User local:', localUser);
      
      if (!localUser.id) {
        window.location.href = 'login.html';
        return;
      }

      // Mostrar loading
      document.getElementById('perfil-loading').style.display = 'block';
      document.getElementById('form-perfil').style.display = 'none';
      document.getElementById('perfil-error').style.display = 'none';

      try {
        // Verificar Supabase
        if (typeof supabase === 'undefined') {
          throw new Error('Supabase não carregado. Verifique internet.');
        }

        // Buscar dados
        const {  userData, error } = await supabase
          .from('users')
          .select('*')
          .eq('id', localUser.id)
          .single();

        if (error || !userData) throw new Error('Usuário não encontrado');

        currentUser = userData;
        console.log('✅ Dados carregados:', currentUser.full_name);

        // Preencher formulário
        document.getElementById('perfil-nome').value = currentUser.full_name || '';
        document.getElementById('perfil-email').value = currentUser.email || '';
        document.getElementById('perfil-telefone').value = currentUser.phone || '';
        document.getElementById('perfil-nif').value = currentUser.nif_or_bi || '';

        // Esconder loading, mostrar form
        document.getElementById('perfil-loading').style.display = 'none';
        document.getElementById('form-perfil').style.display = 'block';

        showToast('success', `Bem-vindo, ${currentUser.full_name.split(' ')[0]}!`);

      } catch (err) {
        console.error('❌ Erro:', err);
        document.getElementById('perfil-loading').style.display = 'none';
        document.getElementById('perfil-error').style.display = 'block';
        document.getElementById('error-msg').textContent = err.message;
        showToast('error', 'Erro ao carregar dados');
      }
    });

    // ==================== NAVEGAÇÃO ====================
    function switchTab(tab) {
      console.log('Mudando para:', tab);
      // Esconder todas
      document.getElementById('tab-perfil').style.display = 'none';
      document.getElementById('tab-seguranca').style.display = 'none';
      document.getElementById('nav-perfil').classList.remove('active');
      document.getElementById('nav-seguranca').classList.remove('active');
      
      // Mostrar seleccionada
      document.getElementById('tab-' + tab).style.display = 'block';
      document.getElementById('nav-' + tab).classList.add('active');
    }

    // ==================== PERFIL ====================
    function resetPerfil() {
      if (currentUser) {
        document.getElementById('perfil-nome').value = currentUser.full_name || '';
        document.getElementById('perfil-email').value = currentUser.email || '';
        document.getElementById('perfil-telefone').value = currentUser.phone || '';
        document.getElementById('perfil-nif').value = currentUser.nif_or_bi || '';
      }
      showToast('success', 'Dados repostos');
    }

    document.getElementById('form-perfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> A guardar...';

      try {
        const { error } = await supabase
          .from('users')
          .update({
            full_name: document.getElementById('perfil-nome').value.trim(),
            email: document.getElementById('perfil-email').value.trim().toLowerCase(),
            phone: document.getElementById('perfil-telefone').value.trim(),
            nif_or_bi: document.getElementById('perfil-nif').value.trim()
          })
          .eq('id', currentUser.id);

        if (error) throw error;

        // Actualizar localStorage
        const updated = { ...currentUser,
          full_name: document.getElementById('perfil-nome').value,
          email: document.getElementById('perfil-email').value,
          phone: document.getElementById('perfil-telefone').value,
          nif_or_bi: document.getElementById('perfil-nif').value
        };
        localStorage.setItem('prinfo_user', JSON.stringify(updated));
        currentUser = updated;

        showToast('success', '✅ Perfil actualizado!');
      } catch (err) {
        console.error('Erro:', err);
        showToast('error', 'Erro ao guardar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });

    // ==================== SENHA ====================
    async function updatePassword() {
      const actual = document.getElementById('seg-pass-atual').value;
      const nova = document.getElementById('seg-nova-pass').value;
      const confirm = document.getElementById('seg-confirm').value;

      if (!actual) { showToast('error', 'Digite senha actual'); return; }
      if (nova && nova.length < 8) { showToast('error', 'Mínimo 8 caracteres'); return; }
      if (nova !== confirm) { showToast('error', 'Senhas não coincidem'); return; }

      try {
        // Verificar senha actual
        const hashActual = await hashPassword(actual);
        if (hashActual !== currentUser.password_hash) {
          throw new Error('Senha actual incorrecta');
        }

        // Actualizar
        if (nova) {
          const novoHash = await hashPassword(nova);
          const { error } = await supabase
            .from('users')
            .update({ password_hash: novoHash })
            .eq('id', currentUser.id);
          
          if (error) throw error;
        }

        showToast('success', '✅ Senha actualizada!');
        document.getElementById('seg-pass-atual').value = '';
        document.getElementById('seg-nova-pass').value = '';
        document.getElementById('seg-confirm').value = '';
      } catch (err) {
        showToast('error', err.message);
      }
    }

    // ==================== UTILITÁRIOS ====================
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
    }

    function showToast(type, msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toast.className = 'toast show ' + (type === 'error' ? 'error' : '');
      toastMsg.textContent = msg;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function logout() {
      localStorage.removeItem('prinfo_user');
      localStorage.removeItem('prinfo_logged_in');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
